[package]
name = "clevo-fan-control"
version = "2.0.0"
edition = "2024"
description = "Native x64 Clevo fan controller"

[dependencies]
fltk = { version = "=1.5.23", features = ["fltk-bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
sha2 = "0.10"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Globalization", "Win32_Security", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_System_Registry"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
strip = "debuginfo"
