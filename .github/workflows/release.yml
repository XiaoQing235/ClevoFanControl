name: Build and publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example, v1.0.0)
        required: true
        type: string
      prerelease:
        description: Mark the GitHub Release as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build, test, and publish
    runs-on: windows-2025-vs2026

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          $releaseTag = $env:RELEASE_TAG.Trim()
          $tagPattern = '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$'
          if (-not [System.Text.RegularExpressions.Regex]::IsMatch($releaseTag, $tagPattern)) {
            throw "Release tag '$releaseTag' must use a version such as v1.2.3 or v1.2.3-beta.1."
          }
          Write-Output "Release tag validation passed for '$releaseTag'."

          $releaseUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$releaseTag"
          $releaseRequestHeaders = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          $releaseStatusCode = 0
          try {
            Invoke-RestMethod -Method Get -Uri $releaseUri -Headers $releaseRequestHeaders -SkipHttpErrorCheck -StatusCodeVariable releaseStatusCode | Out-Null
          }
          catch {
            throw "Unable to check whether GitHub Release '$releaseTag' exists: $($_.Exception.Message)"
          }

          Write-Output "Release lookup returned HTTP $releaseStatusCode for '$releaseTag'."
          if ($releaseStatusCode -eq 200) {
            throw "GitHub Release '$releaseTag' already exists."
          }
          if ($releaseStatusCode -ne 404) {
            throw "Unable to check whether GitHub Release '$releaseTag' exists: HTTP $releaseStatusCode."
          }

          $remoteTagLookup = @(git ls-remote --tags origin "refs/tags/$releaseTag" 2>&1)
          $tagLookupExitCode = $LASTEXITCODE
          Write-Output "Remote tag lookup exited $tagLookupExitCode with $($remoteTagLookup.Count) output line(s)."
          if ($tagLookupExitCode -ne 0) {
            throw "Unable to check whether remote tag '$releaseTag' exists (git exit code $tagLookupExitCode): $($remoteTagLookup -join ' ')"
          }
          if ($remoteTagLookup.Count -gt 0) {
            throw "Remote tag '$releaseTag' already exists."
          }

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build Release Win32
        shell: pwsh
        run: >-
          msbuild ClevoFanControl.sln
          /m
          /t:Rebuild
          /p:Configuration=Release
          /p:Platform=Win32

      - name: Run tests
        shell: pwsh
        run: |
          & .\Release\ClevoFanControlTests.exe
          exit $LASTEXITCODE

      - name: Package release
        id: package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'

          $releaseTag = $env:RELEASE_TAG.Trim()
          $packageName = "ClevoFanControl-$releaseTag-win32"
          $stagingDirectory = Join-Path $env:RUNNER_TEMP $packageName
          $archivePath = Join-Path $env:GITHUB_WORKSPACE "$packageName.zip"
          $releaseFiles = @(
            '.\Release\ClevoFanControl.exe'
            '.\NVGPU_DLL.dll'
            '.\NTPortDrvSetup.exe'
            '.\ClevoEcInfo.dll'
          )

          New-Item -ItemType Directory -Path $stagingDirectory | Out-Null
          foreach ($file in $releaseFiles) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Required release file is missing: $file"
            }
            Copy-Item -LiteralPath $file -Destination $stagingDirectory
          }

          Compress-Archive -Path (Join-Path $stagingDirectory '*') -DestinationPath $archivePath -CompressionLevel Optimal
          "archive=$archivePath" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          $releaseTag = $env:RELEASE_TAG.Trim()
          $arguments = @(
            'release', 'create', $releaseTag, $env:RELEASE_ARCHIVE,
            '--repo', $env:GITHUB_REPOSITORY,
            '--target', $env:GITHUB_SHA,
            '--title', "ClevoFanControl $releaseTag",
            '--generate-notes'
          )

          if ($env:PRERELEASE -eq 'true') {
            $arguments += '--prerelease'
          }

          gh @arguments
          exit $LASTEXITCODE
