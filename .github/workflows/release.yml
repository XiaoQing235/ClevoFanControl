name: Build and publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example, v1.0.0)
        required: true
        type: string
      prerelease:
        description: Mark the GitHub Release as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build, test, and publish
    runs-on: windows-2025-vs2026

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw "Release tag '$env:RELEASE_TAG' must use a version such as v1.2.3 or v1.2.3-beta.1."
          }

          $releaseLookup = gh api "/repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" 2>&1
          $releaseLookupExitCode = $LASTEXITCODE
          if ($releaseLookupExitCode -eq 0) {
            throw "GitHub Release '$env:RELEASE_TAG' already exists."
          }
          if (($releaseLookup | Out-String) -notmatch 'HTTP 404') {
            throw "Unable to check whether GitHub Release '$env:RELEASE_TAG' exists: $releaseLookup"
          }

          git ls-remote --exit-code --tags origin "refs/tags/$env:RELEASE_TAG" *> $null
          $tagLookupExitCode = $LASTEXITCODE
          if ($tagLookupExitCode -eq 0) {
            throw "Remote tag '$env:RELEASE_TAG' already exists."
          }
          if ($tagLookupExitCode -ne 2) {
            throw "Unable to check whether remote tag '$env:RELEASE_TAG' exists (git exit code $tagLookupExitCode)."
          }

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build Release Win32
        shell: pwsh
        run: >-
          msbuild ClevoFanControl.sln
          /m
          /t:Rebuild
          /p:Configuration=Release
          /p:Platform=Win32

      - name: Run tests
        shell: pwsh
        run: |
          & .\Release\ClevoFanControlTests.exe
          exit $LASTEXITCODE

      - name: Package release
        id: package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'

          $packageName = "ClevoFanControl-$env:RELEASE_TAG-win32"
          $stagingDirectory = Join-Path $env:RUNNER_TEMP $packageName
          $archivePath = Join-Path $env:GITHUB_WORKSPACE "$packageName.zip"
          $releaseFiles = @(
            '.\Release\ClevoFanControl.exe'
            '.\NVGPU_DLL.dll'
            '.\NTPortDrvSetup.exe'
            '.\ClevoEcInfo.dll'
          )

          New-Item -ItemType Directory -Path $stagingDirectory | Out-Null
          foreach ($file in $releaseFiles) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Required release file is missing: $file"
            }
            Copy-Item -LiteralPath $file -Destination $stagingDirectory
          }

          Compress-Archive -Path (Join-Path $stagingDirectory '*') -DestinationPath $archivePath -CompressionLevel Optimal
          "archive=$archivePath" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          $arguments = @(
            'release', 'create', $env:RELEASE_TAG, $env:RELEASE_ARCHIVE,
            '--repo', $env:GITHUB_REPOSITORY,
            '--target', $env:GITHUB_SHA,
            '--title', "ClevoFanControl $env:RELEASE_TAG",
            '--generate-notes'
          )

          if ($env:PRERELEASE -eq 'true') {
            $arguments += '--prerelease'
          }

          gh @arguments
          exit $LASTEXITCODE
